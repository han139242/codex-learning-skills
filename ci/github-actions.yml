name: Skill checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-check.txt
      - run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Parse the Word helper
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'skills/hhy-coursework-delivery/scripts/render_word.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors) { throw ($errors -join "`n") }
